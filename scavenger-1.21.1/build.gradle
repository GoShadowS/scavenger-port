plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version + "+" + rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `scavenger-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // OctoLib (formerly ShatterLib) - the library Scavenger is built on top of.
        // NOTE: maven.octo-studios.com is a dead/parked domain; OctoLib is served from
        // maven.shatterbyte.com/releases (same URL the original 26.3 build-logic uses).
        maven {
            name = 'Shatterbyte'
            url = 'https://maven.shatterbyte.com/releases'
            content { includeGroup 'it.hurts.octostudios.octolib' }
        }

        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
            content { includeGroup 'org.parchmentmc.data' }
        }

        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"

        loom {
            silentMojangMappingsLicense()
        }

        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-$rootProject.parchment_minecraft_version:$rootProject.parchment_version@zip")
        }

        modImplementation "it.hurts.octostudios.octolib:octolib-$project.name:$rootProject.octolib_version"
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.encoding = 'UTF-8'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // Add repositories to publish to here.
        }
    }
}
