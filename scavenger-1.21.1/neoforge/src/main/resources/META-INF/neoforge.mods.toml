license = "GPL-3.0-or-later"

[[mods]]
modId = "scavenger"
version = "${version}"
displayName = "Scavenger"
authors = "catboybinary (1.21.1 port by Shad11t)"
description = '''
A mod for interesting item speedruns with additional modifiers.

Unofficial port of catboybinary's Scavenger to Minecraft 1.21.1 (Fabric + NeoForge).
Original mod: https://github.com/catboybinary/scavenger (GPL-3.0).
'''
logoFile = "icon.png"

[[dependencies.scavenger]]
